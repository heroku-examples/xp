
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Reloading Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #333;
            overflow: hidden;
        }

        #controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: #e8e8e8;
            padding: 12px 20px;
            border-bottom: 1px solid #d0d0d0;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
        }

        #controls label {
            color: #666;
            font-size: 12px;
            margin-right: 5px;
        }

        #controls input {
            padding: 6px 10px;
            border: 1px solid #ccc;
            background: #fff;
            color: #333;
            border-radius: 3px;
            font-size: 13px;
        }

        #controls input[type="text"] {
            width: 300px;
        }

        #controls input[type="number"] {
            width: 80px;
        }

        #controls input[type="range"] {
            width: 150px;
            cursor: pointer;
        }

        #delayValue {
            color: #333;
            font-weight: 600;
            min-width: 25px;
            display: inline-block;
            text-align: right;
        }

        #controls button {
            padding: 6px 16px;
            border: 1px solid #aaa;
            background: #d8d8d8;
            color: #333;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }

        #controls button:hover {
            background: #c8c8c8;
        }

        #controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-left: auto;
            font-size: 12px;
            color: #888;
        }

        #container {
            position: absolute;
            top: 53px;
            left: 0;
            right: 0;
            bottom: 0;
            display: grid;
            gap: 8px;
            background: #f5f5f5;
            padding: 8px;
        }

        .frame-wrapper {
            position: relative;
            overflow: hidden;
            background: #fff;
            border-radius: 8px;
        }

        .frame-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 2%;
            background: linear-gradient(to right, rgba(245, 245, 245, 0.8), rgba(245, 245, 245, 0.6));
            width: 0;
            transition: width 0.1s linear;
            z-index: 10;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            mix-blend-mode: difference;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label>URL:</label>
        <input type="text" id="urlInput" placeholder="https://example.com">
        <label>Delay (s):</label>
        <input type="range" id="delaySlider" value="5" min="1" max="30" step="1">
        <span id="delayValue">5</span>s
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <button id="resetBtn">Reset</button>
        <div id="status"></div>
    </div>

    <div id="container"></div>

    <script>
        let frames = [];
        let intervalId = null;
        let frameCount = 0;
        let isRunning = false;

        const urlInput = document.getElementById('urlInput');
        const delaySlider = document.getElementById('delaySlider');
        const delayValue = document.getElementById('delayValue');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const container = document.getElementById('container');
        const status = document.getElementById('status');

        // Update delay value display when slider changes
        delaySlider.addEventListener('input', () => {
            delayValue.textContent = delaySlider.value;
        });

        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        if (params.has('url')) {
            urlInput.value = params.get('url');
        }
        if (params.has('delay')) {
            delaySlider.value = params.get('delay');
            delayValue.textContent = params.get('delay');
        }

        // Auto-start if URL is provided
        if (params.has('url') && params.has('autostart')) {
            setTimeout(() => startBtn.click(), 100);
        }

        function updateLayout() {
            const count = frames.length;
            if (count === 0) {
                container.style.gridTemplateColumns = '1fr';
                container.style.gridTemplateRows = '1fr';
                return;
            }

            // Calculate optimal grid layout
            const cols = Math.ceil(Math.sqrt(count));
            const rows = Math.ceil(count / cols);

            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        }

        function addFrame() {
            const url = urlInput.value.trim();
            if (!url) {
                updateStatus('Please enter a URL');
                return;
            }

            frameCount++;

            const wrapper = document.createElement('div');
            wrapper.className = 'frame-wrapper';

            const loadingBar = document.createElement('div');
            loadingBar.className = 'loading-bar';

            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.sandbox = 'allow-same-origin allow-scripts allow-forms allow-popups';

            wrapper.appendChild(loadingBar);
            wrapper.appendChild(iframe);
            container.appendChild(wrapper);

            // Animate loading bar from 0 to 100% over 10 seconds
            const startTime = Date.now();
            const duration = 10000; // 10 seconds
            let animationId = null;
            let isLoaded = false;

            const animateBar = () => {
                if (isLoaded) return; // Stop if page loaded

                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                loadingBar.style.width = `${progress * 100}%`;

                if (progress < 1) {
                    animationId = requestAnimationFrame(animateBar);
                }
            };

            // Freeze bar when iframe loads
            iframe.addEventListener('load', () => {
                isLoaded = true;
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
            });

            animationId = requestAnimationFrame(animateBar);

            frames.push(wrapper);
            updateLayout();
            updateStatus(`${frameCount} frame${frameCount > 1 ? 's' : ''}`);
        }

        function start() {
            if (isRunning) return;

            const url = urlInput.value.trim();
            const delay = parseInt(delaySlider.value) * 1000;

            if (!url) {
                updateStatus('Please enter a URL');
                return;
            }

            if (delay < 1000) {
                updateStatus('Delay must be at least 1 second');
                return;
            }

            isRunning = true;
            startBtn.disabled = true;
            urlInput.disabled = true;
            delaySlider.disabled = true;

            // Add first frame immediately
            addFrame();

            // Set up interval for subsequent frames
            intervalId = setInterval(addFrame, delay);

            updateStatus(`Running: new frame every ${delay / 1000}s`);
        }

        function stop() {
            if (!isRunning) return;

            isRunning = false;
            clearInterval(intervalId);
            intervalId = null;

            startBtn.disabled = false;
            urlInput.disabled = false;
            delaySlider.disabled = false;

            updateStatus('Stopped');
        }

        function reset() {
            stop();
            frames = [];
            frameCount = 0;
            container.innerHTML = '';
            updateLayout();
            updateStatus('Reset');
        }

        function updateStatus(msg) {
            status.textContent = msg;
        }

        startBtn.addEventListener('click', start);
        stopBtn.addEventListener('click', stop);
        resetBtn.addEventListener('click', reset);

        // Handle URL changes dynamically
        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.has('url')) {
                urlInput.value = params.get('url');
            }
            if (params.has('delay')) {
                delaySlider.value = params.get('delay');
                delayValue.textContent = params.get('delay');
            }
        });

        updateStatus('Ready. Enter URL and click Start.');
    </script>
</body>
</html>
